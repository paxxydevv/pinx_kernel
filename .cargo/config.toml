[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-nostdlib",
    "-C", "linker=rust-lld",
    "-C", "linker-flavor=ld.lld",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "no-redzone=yes",
]
